# WebAPI Mixin Configuration
# Set each value to true/false to control whether the corresponding mixin is loaded.
# After changes, restart the game for them to take effect.
#
# ==================== Early Mixins (target vanilla/forge classes) ====================
# These are loaded during the CoreMod phase, before any mod initialization.
# (reserved for future use)

# ==================== Late Mixins (target other mods' classes) ====================
# These are loaded after all mods have been discovered.

# MTELapotronicSuperCapacitor.getInfoMap: fixes GT5 LapotronicSuperCapacitor's getInfoMap method
mixin.late.MTELapotronicSuperCapacitor.getInfoMap=true
# Replace reflection with direct field access
mixin.nbt=true