name: build env
on:
  workflow_dispatch:
  schedule:
    - cron: '10 1 * * 1-5'
    
jobs:
  Pixiv-Main:
    runs-on: ubuntu-latest
    steps:                          
    - name: checkout main
      uses: actions/checkout@v2
      with:
        ref: main
        fetch-depth: full

    - name: Docker Login
      uses: docker/login-action@v3.4.0
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Clean Old docker
      shell: bash
      continue-on-error: true
      run: |
        HUB_TOKEN=${{ secrets.DOCKERHUB_TOKEN }}
        HUBUSERNAME=${{ secrets.DOCKERHUB_USERNAME }}
        REPO=shirokasoke/mcwebapi


        # 获取 Registry Bearer Token
        TOKEN=$(curl -s -u "$HUBUSERNAME:$HUB_TOKEN" \
          "https://auth.docker.io/token?service=registry.docker.io&scope=repository:$REPO:pull,delete" \
          | jq -r .token)

        # 用 HEAD 请求获取指定 tag 的 digest
        DIGEST=$(curl -sI -H "Authorization: Bearer $TOKEN" \
          -H "Accept: application/vnd.docker.distribution.manifest.v2+json" \
          "https://registry-1.docker.io/v2/$REPO/manifests/latest" \
          | grep -i Docker-Content-Digest | tr -d '\r' | awk '{print $2}')

        echo ""
        echo "Current 'latest' digest: $DIGEST"

        # 删除指定 digest 的 manifest
        curl -s -X DELETE \
          -H "Authorization: Bearer $TOKEN" \
          "https://registry-1.docker.io/v2/$REPO/manifests/$DIGEST"
        echo "Deleted: $REPO@$DIGEST"

    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        platforms: linux/amd64
        file: ./github.Dockerfile
        push: true
        tags: |
          shirokasoke/mcwebapi:latest
        cache-from: type=registry,ref=shirokasoke/mcwebapi:cache
        cache-to: type=registry,ref=shirokasoke/mcwebapi:cache,mode=max